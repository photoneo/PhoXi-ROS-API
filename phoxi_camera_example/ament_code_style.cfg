# Uncrustify configuration for phoxi_camera
# To match .clang-format settings

# Indentation
indent_columns = 4
indent_with_tabs = 0
indent_class = true
indent_access_spec_body = false
indent_access_spec = -2
indent_func_call_param = false
indent_func_def_param = false
indent_func_proto_param = false
indent_align_paren = true
indent_paren_nl = true
# indent_continue = 0
indent_paren_close = 2

# Pointer alignment (match PointerAlignment: Left)
align_var_def_star_style = 1
align_typedef_star_style = 1
sp_before_ptr_star = remove
sp_after_ptr_star = force
sp_between_ptr_star = remove

# Spacing for function parameters
sp_func_def_paren_empty = remove
sp_inside_fparen = remove
sp_fparen_brace = force

# Spacing
sp_after_cast = remove
sp_inside_paren = remove
sp_before_sparen = force
sp_after_sparen = force
sp_before_semi = remove
sp_after_comma = force

# Empty function handling
mod_remove_empty_return = true
nl_func_type_name = remove
nl_func_type_name_class = remove
nl_func_decl_start = remove
nl_func_decl_args = remove
nl_func_decl_end = remove
nl_func_leave_one_liners = true
nl_cpp_lambda_leave_one_liners = true
nl_class_leave_one_liners = true

# Keep empty function bodies on single line: void foo() {}
nl_inside_empty_func = remove
nl_fdef_brace_cond = remove
nl_collapse_empty_body = true
mod_full_brace_empty_func = remove
eat_blanks_before_close_brace = false
eat_blanks_after_open_brace = false

# Line breaks
nl_brace_else = remove
nl_elseif_brace = remove
nl_else_brace = remove
nl_brace_finally = remove
nl_finally_brace = remove
nl_try_brace = remove
nl_getset_brace = remove

# Braces - function braces on same line to match clang-format AfterFunction: false
nl_fdef_brace = remove
nl_enum_brace = add
nl_struct_brace = add
nl_class_brace = add
nl_func_paren = remove
nl_fcall_brace = remove

# Comments
sp_cmt_cpp_start = force
cmt_width = 100

# Code width
code_width = 100

# Allow single line functions
nl_cpp_ldef_brace = remove

# Function definitions - keep opening brace behavior consistent
mod_full_brace_function = ignore
mod_full_brace_if = ignore
