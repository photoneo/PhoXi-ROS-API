phoxi_camera:
  ros__parameters:
    device_id: "" # hardware identification of PhoXi device (serial number or network ID)
    frame_id: "phoxi_camera_sensor" # coordinate frame ID for published point cloud
    publish_combined: false # true: publish only point_cloud (XYZ + all fields); false: publish individual topics
    # frameSettings/* — override which components the device sends per frame.
    # Omit any entry to leave the device's current setting unchanged.
    frameSettings:
      PointCloud: true
      NormalMap: false
      DepthMap: true
      Texture: true
      ConfidenceMap: false
      ColorCameraImage: false
      EventMap: false
