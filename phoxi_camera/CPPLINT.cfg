# cpplint configuration for phoxi_camera
# https://github.com/cpplint/cpplint

# Set line length to 100 to match clang-format
linelength=100

# Filter out specific checks that don't align with the project style
filter=-build/c++11
filter=-build/include_order
filter=-build/header_guard
filter=-build/namespaces
filter=-whitespace/braces
filter=-whitespace/indent
filter=-runtime/references
filter=-runtime/string
filter=-readability/alt_tokens
filter=-readability/todo
filter=-legal/copyright

# Root directory for header guards
root=phoxi_camera
